name: Tag merged FourFold release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  actions: write

concurrency:
  group: fourfold-tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    env:
      PROJECT_PATH: src/FourFoldAccountManager.Desktop/FourFoldAccountManager.Desktop.csproj
      PROJECT_NAME: FourFold Account Manager
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Check out the merged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine release tag
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content -Raw -LiteralPath $env:PROJECT_PATH
          $projectVersion = [string]($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($projectVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "Project Version '$projectVersion' must be MAJOR.MINOR.PATCH."
          }

          $tagRecords = @(git tag --list 'v*' | ForEach-Object {
              if ($_ -match '^v(\d+)\.(\d+)\.(\d+)$') {
                  [pscustomobject]@{ Tag = $_; Version = [version]$_.Substring(1) }
              }
          } | Sort-Object Version -Descending)
          $latest = $tagRecords | Select-Object -First 1

          $existingForMerge = @($tagRecords | ForEach-Object {
              $target = (git rev-list -n 1 $_.Tag).Trim()
              $parentText = (git show -s --format=%P $target).Trim()
              $parents = if ([string]::IsNullOrWhiteSpace($parentText)) { @() } else { @($parentText -split '\s+') }
              if ($target -eq $env:MERGE_SHA -or ($parents.Count -eq 1 -and $parents[0] -eq $env:MERGE_SHA)) {
                  [pscustomobject]@{ Tag = $_.Tag; Version = $_.Version; Commit = $target }
              }
          } | Sort-Object Version -Descending | Select-Object -First 1)

          if ($existingForMerge.Count -gt 0) {
              $existing = $existingForMerge[0]
              $runs = gh run list --workflow release.yml --repo $env:GITHUB_REPOSITORY --json status,headBranch --limit 100
              if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect existing release runs.' }
              $activeRuns = @($runs | ConvertFrom-Json | Where-Object {
                  $_.headBranch -eq $existing.Tag -and $_.status -in @('queued', 'in_progress', 'waiting', 'requested', 'pending')
              })
              "tag=$($existing.Tag)" >> $env:GITHUB_OUTPUT
              "version=$($existing.Version)" >> $env:GITHUB_OUTPUT
              "release_commit=$($existing.Commit)" >> $env:GITHUB_OUTPUT
              "create_tag=false" >> $env:GITHUB_OUTPUT
              $publish = if ($activeRuns.Count -eq 0) { 'true' } else { 'false' }
              "publish=$publish" >> $env:GITHUB_OUTPUT
              if ($activeRuns.Count -gt 0) {
                  "Release $($existing.Tag) is already queued or running." >> $env:GITHUB_STEP_SUMMARY
              }
              exit 0
          }

          $sourceVersion = [version]$projectVersion
          $releaseVersion = $sourceVersion
          $releaseCommit = $env:MERGE_SHA
          if ($null -ne $latest -and $sourceVersion -le $latest.Version) {
              $releaseVersion = [version]::new($latest.Version.Major, $latest.Version.Minor, $latest.Version.Build + 1)
              $nextVersion = $releaseVersion.ToString(3)
              $text = Get-Content -Raw -LiteralPath $env:PROJECT_PATH
              $pattern = '(<Version>)' + [regex]::Escape($projectVersion) + '(</Version>)'
              if ([regex]::Matches($text, $pattern).Count -ne 1) {
                  throw "Expected exactly one project version field containing '$projectVersion'."
              }
              $text = [regex]::Replace($text, $pattern, { param($match) $match.Groups[1].Value + $nextVersion + $match.Groups[2].Value }, 1)
              Set-Content -LiteralPath $env:PROJECT_PATH -Value $text -NoNewline
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add $env:PROJECT_PATH
              git commit -m "chore: prepare release v$nextVersion"
              $releaseCommit = (git rev-parse HEAD).Trim()
          }

          $tag = "v$($releaseVersion.ToString(3))"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($releaseVersion.ToString(3))" >> $env:GITHUB_OUTPUT
          "release_commit=$releaseCommit" >> $env:GITHUB_OUTPUT
          "create_tag=true" >> $env:GITHUB_OUTPUT
          "publish=true" >> $env:GITHUB_OUTPUT
          "### Release candidate" >> $env:GITHUB_STEP_SUMMARY
          "- $env:PROJECT_NAME $tag" >> $env:GITHUB_STEP_SUMMARY

      - name: Create and push release tag
        if: steps.version.outputs.create_tag == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.release_commit }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $env:RELEASE_TAG $env:RELEASE_COMMIT -m "$env:PROJECT_NAME $env:RELEASE_TAG"
          git push origin $env:RELEASE_TAG

      - name: Dispatch Windows release workflow
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh workflow run release.yml --repo $env:GITHUB_REPOSITORY --ref $env:RELEASE_TAG --field version=$env:RELEASE_VERSION
          "Publishing was queued for $env:RELEASE_TAG." >> $env:GITHUB_STEP_SUMMARY
