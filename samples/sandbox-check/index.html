<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sandbox check</title>
</head>
<body style="margin:0;padding:14px;background:var(--ff-surface);color:var(--ff-text);font:12px 'Segoe UI',sans-serif">
  <h1 style="font-size:16px;margin:0 0 8px">Sandbox check</h1>
  <p style="color:var(--ff-text-muted)">Every line should say PASS.</p>
  <ul id="results" style="padding-left:16px;line-height:1.7"></ul>
  <button id="open">Open example.com (should open your browser)</button>
  <button id="leave">Navigate away (should do nothing)</button>
  <button id="flood">Flood FourFold (should stop this plugin)</button>
  <script>window.inlineScriptRan = true;</script>
  <script src="check.js"></script>
</body>
</html>
